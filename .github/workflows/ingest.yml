name: ingest

on:
  schedule:
    # ⚠️ Các cron KHÔNG được trùng phút: GitHub tạo 1 run cho MỖI cron khớp thời
    # điểm, nên "*/30" và "0 */6" cùng bắn ở phút 0 của mỗi 6 giờ → 2 run chạy
    # nối tiếp nhau (concurrency group), gọi AniList/YouTube 2 lần vô ích.
    - cron: "*/30 * * * *"   # Job A: lịch phát (mỗi 30')
    - cron: "10 */6 * * *"   # Job C: video official (lệch 10' để không trùng A)
    - cron: "17 19 * * *"    # Job B: catalog (02:17 giờ VN)
    - cron: "40 20 * * *"    # Job D: TMDB — tên/tóm tắt tiếng Việt + tập (03:40 giờ VN)
    - cron: "30 3 * * *"     # Job C: BACKFILL sâu toàn bộ kênh (10:30 giờ VN)
    #
    # ⚠️ GitHub TỰ TẮT scheduled workflow sau 60 ngày repo không có commit mới.
    # Run do cron tạo ra không tính là "hoạt động". Nếu app im lặng quá 2 tháng,
    # vào Actions → ingest → "Enable workflow".
  workflow_dispatch:
    inputs:
      command:
        description: "schedule | catalog | youtube | tmdb | seasons | jikan | all"
        default: "all"
      extra:
        description: "cờ thêm, vd: --refresh --limit-tmdb 200 (để trống nếu không cần)"
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r ingest/requirements.txt

      - name: Chọn job theo cron
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "*/30 * * * *") echo "cmd=schedule"  >> $GITHUB_OUTPUT ;;
            "10 */6 * * *") echo "cmd=youtube"   >> $GITHUB_OUTPUT ;;
            "17 19 * * *")  echo "cmd=catalog"   >> $GITHUB_OUTPUT ;;
            "40 20 * * *")  echo "cmd=tmdb"      >> $GITHUB_OUTPUT ;;
            # Backfill sâu 1 lần/ngày. Cron 6h chỉ đọc RSS = 15 video mới nhất
            # mỗi kênh nên KHÔNG BAO GIỜ lấy được lịch sử kênh. Đo 02/11/2026:
            # 163 bộ / 2028 tập metadata nhưng chỉ 485 link ⇒ 94 bộ liệt kê
            # tập mà không có video nào để xem. `--deep` dùng YouTube Data API
            # lấy toàn bộ uploads (cache ghép tên giữ chi phí thấp).
            "30 3 * * *")  echo "cmd=youtube"   >> $GITHUB_OUTPUT
                           echo "extra=--deep --max-videos 2000" >> $GITHUB_OUTPUT ;;
            # Job E/F không có cron riêng: chạy kèm Job D hằng ngày (dưới đây)
            *)              echo "cmd=${{ github.event.inputs.command || 'all' }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Chạy ingest
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_API_KEY:         ${{ secrets.TMDB_API_KEY }}
          # Chỉ Muse Việt Nam (đổi thành "muse_vn,ani_one_asia" nếu muốn thêm kênh)
          YOUTUBE_CHANNELS:     ${{ vars.YOUTUBE_CHANNELS || 'muse_vn' }}
          # Không có TMDB_API_KEY → job D báo rõ rồi bỏ qua (xem main.py)
          INGEST_COMMAND:       ${{ steps.pick.outputs.cmd }}
          # cron backfill sâu tự đặt cờ; bấm tay thì dùng `extra` của bạn.
          INGEST_EXTRA:         ${{ steps.pick.outputs.extra }} ${{ github.event.inputs.extra }}
        run: |
          # `extra` cho phép bấm tay với cờ như --refresh; cron để trống.
          # Không dùng eval để tránh chèn lệnh — chỉ tách theo khoảng trắng.
          read -r -a EXTRA <<< "$INGEST_EXTRA"
          python -m ingest.main "$INGEST_COMMAND" "${EXTRA[@]}"

      # Job D hằng ngày: bổ sung bộ thiếu → LÀM MỚI bộ đang chiếu (bắt tập mới)
      # → tìm MÙA MỚI qua quan hệ SEQUEL → lấp danh sách tập còn thiếu bằng Jikan.
      # Trước đây chỉ có `tmdb` (chế độ bổ sung) nên tập mới của bộ đang chiếu
      # KHÔNG BAO GIỜ được cập nhật.
      - name: Job C'/D/E/F/G hằng ngày (chỉ khi cron 20:40 hoặc dispatch "all")
        if: github.event.schedule == '40 20 * * *' || github.event.inputs.command == 'all'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_API_KEY:         ${{ secrets.TMDB_API_KEY }}
        run: |
          set -e
          python -m ingest.main tmdb --limit-tmdb 200
          python -m ingest.main tmdb --refresh --limit-tmdb 200
          python -m ingest.main seasons --limit-seasons 120
          python -m ingest.main episodes
          # Job K: tên tiếng Việt trên kênh → bộ trong DB (TMDB original_name →
          # AniList). Đo 03/11/2026: 51 tên / 601 video không vào được DB vì tên
          # Việt không có trên AniList. Chạy TRƯỚC job C để alias có tác dụng ngay.
          python -m ingest.main alias
          python -m ingest.main youtube
          # Job I: ẩn/hiện bộ theo NỘI DUNG thật. Trước đây chỉ chạy trong
          # `all` nên cron này bỏ quên ⇒ bộ 0 tập/0 video (trang trắng) vẫn hiện.
          python -m ingest.main publish
          # Job G: kiểm bất biến dữ liệu — vi phạm cứng thì ĐỎ, không im lặng.
          python -m ingest.main check
          # Job J: độ phủ nội dung — in ra bao nhiêu bộ có video thật sự.
          python -m ingest.main coverage
          # Job F chạy CUỐI: Jikan là nguồn DUY NHẤT có thể bị chặn (đo 02/11/2026
          # trên máy chủ dự án: api.jikan.moe timeout cả IPv4). Nếu để giữa chuỗi
          # thì `set -e` sẽ chặn luôn episodes/check phía sau — hỏng dây chuyền.
          # Đặt cuối: hỏng Jikan vẫn làm run ĐỎ (đúng), nhưng mọi job khác đã xong.
          python -m ingest.main jikan --fill-gaps --limit-jikan 60

