name: app

# CI cho app Flutter: mỗi lần sửa app/ là analyze + test tự chạy.
# Mục đích: bắt lỗi biên dịch trước khi phải mở máy có Flutter SDK.
# Chi phí: 0đ (repo public → GitHub Actions free).

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded
