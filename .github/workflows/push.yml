name: push

# Gửi thông báo "tập N vừa phát sóng" (Edge Function /push → FCM v1).
#
# ⚠️ CRON ĐANG TẮT CÓ CHỦ Ý. Chỉ bật sau khi đã có đủ 3 thứ:
#    1. Supabase secret `FCM_SERVICE_ACCOUNT`  (Firebase → Service accounts)
#    2. Supabase secret `PUSH_CRON_SECRET`     (chuỗi ngẫu nhiên bạn tự sinh)
#    3. GitHub secrets của repo này: SUPABASE_URL, SUPABASE_ANON_KEY, PUSH_CRON_SECRET
# Khi chưa đủ, /push từ chối (401 "Sai x-cron-secret") — job này sẽ ĐỎ, không im lặng.
# Xong thì bỏ comment khối `schedule:` bên dưới.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = chỉ in ra sẽ gửi gì, KHÔNG gửi thật"
        type: boolean
        default: true

  # schedule:
  #   - cron: "*/15 * * * *"

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kiểm tra secret đã đủ chưa
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          missing=""
          [ -z "$URL" ]  && missing="$missing SUPABASE_URL"
          [ -z "$ANON" ] && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$CRON" ] && missing="$missing PUSH_CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Thiếu GitHub secret:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Gọi /push
        env:
          BASE: ${{ secrets.SUPABASE_URL }}/functions/v1
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON: ${{ secrets.PUSH_CRON_SECRET }}
          DRY: ${{ inputs.dry_run }}
        run: |
          q=""
          [ "$DRY" = "true" ] && q="?dry_run=true"
          code=$(curl -sS -o body.json -w '%{http_code}' -m 120 \
            -X POST "$BASE/push$q" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "x-cron-secret: $CRON")
          echo "HTTP $code"
          cat body.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::/push trả HTTP $code — xem body ở trên"
            exit 1
          fi

      - name: Tóm tắt
        run: |
          python3 -c "import json;d=json.load(open('body.json'))['data'];print('tập mới:',d.get('new_episodes') or d.get('episodes'),'| thiết bị:',d.get('devices'),'| đã gửi:',d.get('sent'),'| lỗi:',d.get('failed',0))"
